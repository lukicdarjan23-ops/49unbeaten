backend:
  name: git-gateway
  branch: claude/homepage-build-h289yn

# Where uploaded images are stored in the repo, and the URL path the
# site serves them from.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General"
        file: "content/settings.json"
        fields:
          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Shown at the top of the homepage. Leave blank to keep the grey placeholder."
          - label: "Hero Image Alt Text"
            name: "hero_alt"
            widget: "string"
            required: false
          - label: "Hero Link"
            name: "hero_link"
            widget: "string"
          - label: "\"Top Sellers\" Heading"
            name: "top_sellers_title"
            widget: "string"
          - label: "\"View All\" Link Text"
            name: "view_all_text"
            widget: "string"
          - label: "\"View All\" Link URL"
            name: "view_all_link"
            widget: "string"
          - label: "Instagram URL"
            name: "instagram_url"
            widget: "string"
            required: false
          - label: "WhatsApp URL"
            name: "whatsapp_url"
            widget: "string"
            required: false
          - label: "Footer Notice Text"
            name: "sales_notice"
            widget: "text"

  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "Top Sellers Grid"
        file: "content/products.json"
        fields:
          - name: "items"
            label: "Products"
            widget: "list"
            summary: "{{title}} — {{price}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Type"
                name: "type"
                widget: "string"
                default: "Print"
              - label: "Base Price (USD)"
                name: "price"
                widget: "number"
                value_type: "float"
                min: 0
                hint: "Used only when the product has no sizes listed below. With sizes, each size sets its own price."
              - label: "Product Link"
                name: "href"
                widget: "string"
              - label: "Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Leave blank to show the grey placeholder."
              - label: "Image Alt Text"
                name: "alt"
                widget: "string"
                required: false
              - label: "Sizes & Prices"
                name: "sizes"
                widget: "list"
                required: false
                summary: "{{fields.label}} — {{fields.price}}"
                hint: "Shown when the + button is clicked; the item is only added to the cart once a size is picked. THE FIRST SIZE LEADS: the card rests at its price and its box is filled in the picker, so put the size you most want to sell at the top. Keep labels short (they sit in small boxes). Leave the list empty to add straight to the cart at the base price."
                fields:
                  - { label: "Size", name: "label", widget: "string" }
                  - label: "Price (USD)"
                    name: "price"
                    widget: "number"
                    value_type: "float"
                    min: 0
