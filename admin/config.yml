backend:
  name: git-gateway
  branch: claude/homepage-build-h289yn

# Where uploaded images are stored in the repo, and the URL path the
# site serves them from.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General"
        file: "content/settings.json"
        fields:
          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Shown at the top of the homepage. Leave blank to keep the grey placeholder."
          - label: "Hero Image Alt Text"
            name: "hero_alt"
            widget: "string"
            required: false
          - label: "Hero Link"
            name: "hero_link"
            widget: "string"
          - label: "\"Top Sellers\" Heading"
            name: "top_sellers_title"
            widget: "string"
          - label: "\"View All\" Link Text"
            name: "view_all_text"
            widget: "string"
          - label: "\"View All\" Link URL"
            name: "view_all_link"
            widget: "string"
          - label: "Instagram URL"
            name: "instagram_url"
            widget: "string"
            required: false
          - label: "WhatsApp URL"
            name: "whatsapp_url"
            widget: "string"
            required: false
          - label: "Footer Notice Text"
            name: "sales_notice"
            widget: "text"

  - name: "products"
    label: "Proizvodi"
    files:
      - name: "products"
        label: "Svi proizvodi"
        file: "content/products.json"
        fields:
          - name: "items"
            label: "Proizvodi"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            label_singular: "Proizvod"
            hint: "Dodaj proizvod klikom na dugme ispod. Svaki proizvod automatski dobija svoju stranicu."
            fields:
              - label: "Naziv"
                name: "title"
                widget: "string"
              - label: "Adresa stranice (slug)"
                name: "slug"
                widget: "string"
                hint: "Mala slova i crtice, bez razmaka i kvacica. Npr: the-statue. Mora biti razlicito od svih ostalih proizvoda."
              - label: "Podnaslov na kartici"
                name: "type"
                widget: "string"
                default: "Print"
              - label: "Kategorija"
                name: "category"
                widget: "select"
                options: ["Art", "Apparel", "Gifts"]
                default: "Art"
              - label: "Slika na kartici"
                name: "image"
                widget: "image"
                required: false
                hint: "Slika koja se vidi u mrezi proizvoda. Ostavi prazno za sivi kvadrat."
              - { label: "Opis slike na kartici", name: "alt", widget: "string", required: false }
              - label: "Tekst ispod cene"
                name: "ship_note"
                widget: "string"
                required: false
              - label: "Slike po materijalu"
                name: "media"
                widget: "list"
                summary: "{{fields.group}}"
                hint: "Jedna slika po materijalu, deli je svaka velicina tog materijala. Naziv grupe mora da se poklopi sa Grupom kod opcija ispod."
                fields:
                  - { label: "Grupa", name: "group", widget: "string" }
                  - { label: "Slika", name: "image", widget: "image", required: false }
                  - { label: "Opis slike", name: "alt", widget: "string", required: false }
              - label: "Velicine i cene"
                name: "variants"
                widget: "list"
                summary: "{{fields.label}} — {{fields.price}}"
                hint: "Svaka opcija ima svoju cenu. Kvacicu Podrazumevano stavi na JEDNU opciju — na njoj se stranica otvara i njena cena se vidi na kartici."
                fields:
                  - { label: "Naziv opcije", name: "label", widget: "string" }
                  - label: "Cena (USD)"
                    name: "price"
                    widget: "number"
                    value_type: "float"
                    min: 0
                  - { label: "Grupa", name: "group", widget: "string" }
                  - { label: "Napomena", name: "note", widget: "string", required: false }
                  - { label: "Podrazumevano", name: "selected", widget: "boolean", default: false, required: false }
              - label: "Napomene ispod dugmeta"
                name: "notes"
                widget: "list"
                required: false
                field: { label: "Napomena", name: "note", widget: "string" }
              - label: "Sekcije koje se otvaraju"
                name: "panels"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Naslov", name: "title", widget: "string" }
                  - { label: "Tekst", name: "body", widget: "text" }
              - { label: "Siroka slika ispod", name: "showcase_image", widget: "image", required: false }
              - { label: "Opis siroke slike", name: "showcase_alt", widget: "string", required: false }

  - name: "contact"
    label: "Contact Page"
    files:
      - name: "contact"
        label: "Contact"
        file: "content/contact.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - label: "Email Address"
            name: "email"
            widget: "string"
            hint: "Shown as a clickable mailto link."
          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"
            hint: "Include the country code, e.g. +381 60 123 4567. Spaces and dashes are stripped for the wa.me link."

  - name: "legal"
    label: "Legal Pages"
    files:
      - name: "privacy"
        label: "Privacy Policy"
        file: "content/privacy.json"
        fields: &legal_fields
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "updated", widget: "string", required: false }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            hint: "DRAFT TEXT — anything in [SQUARE BRACKETS] must be replaced with your real details, and the whole page should be checked by someone qualified before you take orders. Leave a blank line between paragraphs."
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
      - name: "terms"
        label: "Terms & Conditions"
        file: "content/terms.json"
        fields: *legal_fields

  - name: "categories"
    label: "Category Pages"
    files:
      - name: "categories"
        label: "Art / Apparel / Gifts"
        file: "content/categories.json"
        fields:
          - name: "items"
            label: "Categories"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "The Slug must stay as it is — each category page looks itself up by slug. Products appear here by their own Category field."
            fields:
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text", required: false }
              - label: "Hero Image"
                name: "hero_image"
                widget: "image"
                required: false
                hint: "The 260px band at the top. Leave blank for the grey placeholder."
              - { label: "Hero Image Alt Text", name: "hero_alt", widget: "string", required: false }
              - { label: "Hero Link", name: "hero_link", widget: "string", required: false }
