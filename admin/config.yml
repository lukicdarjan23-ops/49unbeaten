backend:
  name: git-gateway
  branch: claude/homepage-build-h289yn

# Where uploaded images are stored in the repo, and the URL path the
# site serves them from.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Podešavanja sajta"
    files:
      - name: "settings"
        label: "Opšte"
        file: "content/settings.json"
        fields:
          - label: "Logo u zaglavlju"
            name: "logo_header"
            widget: "image"
            required: false
            hint: "SVG ili PNG. Zamenjuje ispisano 49 FORTY NINE UNBEATEN. Ostavi prazno da ostane ispisana verzija."
          - label: "Opis logoa u zaglavlju"
            name: "logo_header_alt"
            widget: "string"
            required: false
          - label: "Logo u futeru"
            name: "logo_footer"
            widget: "image"
            required: false
            hint: "Okrugli pečat na dnu. SVG ili PNG, najbolje kvadratna slika. Ostavi prazno da ostane nacrtana verzija."
          - label: "Opis logoa u futeru"
            name: "logo_footer_alt"
            widget: "string"
            required: false
          - label: "Velika slika na početnoj"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Široka slika na vrhu početne strane. Ostavi prazno za sivi kvadrat."
          - label: "Opis velike slike"
            name: "hero_alt"
            widget: "string"
            required: false
          - label: "Tekst preko velike slike"
            name: "hero_text"
            widget: "string"
            required: false
            hint: "Krupan natpis na sredini slike. Ostavi prazno da se ne prikazuje ništa preko slike."
          - label: "Gde vodi velika slika"
            name: "hero_link"
            widget: "string"
          - label: "Naslov iznad mreže proizvoda"
            name: "top_sellers_title"
            widget: "string"
          - label: "Tekst linka desno od naslova"
            name: "view_all_text"
            widget: "string"
          - label: "Gde vodi taj link"
            name: "view_all_link"
            widget: "string"
          - label: "Instagram adresa"
            name: "instagram_url"
            widget: "string"
            required: false
          - label: "WhatsApp adresa"
            name: "whatsapp_url"
            widget: "string"
            required: false
          - label: "Tekst u crnoj traci na dnu"
            name: "sales_notice"
            widget: "text"

  - name: "products"
    label: "Proizvodi"
    files:
      - name: "products"
        label: "Svi proizvodi"
        file: "content/products.json"
        fields:
          - name: "items"
            label: "Proizvodi"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            label_singular: "Proizvod"
            hint: "Klikni Add Proizvod za novi. Svaki proizvod automatski dobija svoju stranu na sajtu."
            fields:
              - label: "Naziv"
                name: "title"
                widget: "string"
              - label: "Adresa stranice (slug)"
                name: "slug"
                widget: "string"
                hint: "Mala slova i crtice, bez razmaka i bez kvačica. Npr: the-statue. Mora biti različit od svih ostalih proizvoda."
              - label: "Podnaslov na kartici"
                name: "type"
                widget: "string"
                default: "Print"
              - label: "Kategorija"
                name: "category"
                widget: "select"
                options: ["Art", "Apparel", "Gifts"]
                default: "Art"
                hint: "Određuje i na kojoj se strani pojavljuje i kako izgleda strana proizvoda. Apparel dobija izbor veličine majice i boje umesto Print/Canvas."
              - label: "Prikaži na naslovnoj (Top Sellers)"
                name: "featured"
                widget: "boolean"
                default: false
                hint: "Čekirani proizvodi čine mrežu na naslovnoj strani. Ako nijedan nije čekiran, prikazuju se svi. Najlepše izgleda kada je čekiran broj deljiv sa 4, 3 i 2 — dakle 4 ili 12; tada nijedan red nije poluprazan ni na jednoj veličini ekrana."
              - label: "Slika na kartici"
                name: "image"
                widget: "image"
                required: false
                hint: "Slika koja se vidi u mreži proizvoda. Ostavi prazno za sivi kvadrat."
              - { label: "Opis slike na kartici", name: "alt", widget: "string", required: false }
              - label: "Tekst ispod cene"
                name: "ship_note"
                widget: "string"
                required: false
              - label: "Slike po materijalu (Print / Canvas)"
                name: "media"
                widget: "list"
                summary: "{{fields.group}}"
                hint: "Jedna slika po materijalu — dele je sve veličine tog materijala. Naziv grupe mora da se poklopi sa Grupom kod opcija ispod."
                fields:
                  - { label: "Grupa", name: "group", widget: "string" }
                  - { label: "Slika", name: "image", widget: "image", required: false }
                  - { label: "Opis slike", name: "alt", widget: "string", required: false }
              - label: "Veličine i cene — SAMO za Art"
                name: "variants"
                widget: "list"
                summary: "{{fields.label}} — {{fields.price}}"
                hint: "Svaka opcija ima svoju cenu. Kvačicu Podrazumevano stavi na SAMO JEDNU opciju — na njoj se strana otvara i njena cena se vidi na kartici."
                fields:
                  - { label: "Naziv opcije", name: "label", widget: "string" }
                  - label: "Cena (USD)"
                    name: "price"
                    widget: "number"
                    value_type: "float"
                    min: 0
                  - { label: "Grupa", name: "group", widget: "string" }
                  - { label: "Napomena", name: "note", widget: "string", required: false }
                  - { label: "Podrazumevano", name: "selected", widget: "boolean", default: false, required: false }
              - label: "Veličine majica — SAMO za Apparel"
                name: "sizes"
                widget: "list"
                required: false
                summary: "{{fields.label}} — {{fields.price}}"
                hint: "Prikazuju se u jednom redu. Kvačicu Podrazumevano stavi na SAMO JEDNU."
                fields:
                  - { label: "Oznaka", name: "label", widget: "string" }
                  - label: "Cena (USD)"
                    name: "price"
                    widget: "number"
                    value_type: "float"
                    min: 0
                  - { label: "Podrazumevano", name: "selected", widget: "boolean", default: false, required: false }
              - label: "Boje majica — SAMO za Apparel"
                name: "colors"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                hint: "Kvadratići ispod veličina. Grupa mora da se poklopi sa Grupom u \"Slike po materijalu\" iznad, da bi se slika menjala sa bojom."
                fields:
                  - { label: "Naziv boje", name: "label", widget: "string" }
                  - label: "Boja"
                    name: "hex"
                    widget: "color"
                    required: false
                    hint: "Boja kvadratića na sajtu."
                  - { label: "Grupa (za sliku)", name: "group", widget: "string", required: false }
                  - { label: "Podrazumevano", name: "selected", widget: "boolean", default: false, required: false }
              - label: "Tabela veličina"
                name: "size_guide"
                widget: "object"
                required: false
                collapsed: true
                hint: "Otvara se kao sekcija na strani proizvoda, iznad ostalih. Ostavi listu praznu da se tabela uopšte ne pojavi."
                fields:
                  - { label: "Naslov sekcije", name: "title", widget: "string", required: false, default: "Size guide" }
                  - label: "Napomena ispod tabele"
                    name: "note"
                    widget: "string"
                    required: false
                    hint: "Npr: Mereno spljošteno, u centimetrima."
                  - label: "Redovi"
                    name: "rows"
                    widget: "list"
                    required: false
                    summary: "{{fields.label}}"
                    label_singular: "Red"
                    fields:
                      - { label: "Veličina", name: "label", widget: "string" }
                      - { label: "Grudi", name: "chest", widget: "string", required: false }
                      - { label: "Dužina", name: "length", widget: "string", required: false }
                      - { label: "Rukav", name: "sleeve", widget: "string", required: false }
              - label: "Napomene ispod dugmeta"
                name: "notes"
                widget: "list"
                required: false
                field: { label: "Napomena", name: "note", widget: "string" }
              - label: "Sekcije koje se otvaraju"
                name: "panels"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Naslov", name: "title", widget: "string" }
                  - { label: "Tekst", name: "body", widget: "text" }
              - { label: "Široka slika na dnu strane", name: "showcase_image", widget: "image", required: false }
              - { label: "Opis široke slike", name: "showcase_alt", widget: "string", required: false }

  - name: "allproducts"
    label: "Strana Svi proizvodi"
    files:
      - name: "allproducts"
        label: "Svi proizvodi"
        file: "content/allproducts.json"
        fields:
          - { label: "Naslov strane", name: "title", widget: "string" }
          - { label: "Uvodni tekst", name: "intro", widget: "text", required: false }
          - label: "Redosled proizvoda"
            name: "order"
            widget: "select"
            default: "mixed"
            options:
              - { label: "Izmešano po kategorijama (preporučeno)", value: "mixed" }
              - { label: "Redom kao u listi Proizvodi", value: "cms" }
              - { label: "Nasumično pri svakom otvaranju", value: "random" }
            hint: "Izmešano znači: prvo jedan Art, pa jedan Apparel, pa jedan Gifts, pa opet Art — tako da se kategorije ne grupišu. Redosled je uvek isti, pa kupac ponovo nađe ono što je video. Nasumično se menja pri svakom osvežavanju."
          - label: "Velika slika na vrhu"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Uska traka na vrhu strane, visine 260px. Ostavi prazno za sivi kvadrat."
          - { label: "Opis slike", name: "hero_alt", widget: "string", required: false }
          - label: "Tekst preko slike"
            name: "hero_text"
            widget: "string"
            required: false
            hint: "Krupan natpis na sredini slike. Ostavi prazno da se ne prikazuje ništa."
          - { label: "Gde vodi slika", name: "hero_link", widget: "string", required: false }

  - name: "contact"
    label: "Strana Kontakt"
    files:
      - name: "contact"
        label: "Kontakt"
        file: "content/contact.json"
        fields:
          - { label: "Naslov", name: "title", widget: "string" }
          - { label: "Uvodni tekst", name: "intro", widget: "text", required: false }
          - label: "Mejl adresa"
            name: "email"
            widget: "string"
            hint: "Prikazuje se kao link na koji se klikne."
          - label: "WhatsApp broj"
            name: "whatsapp"
            widget: "string"
            hint: "Sa pozivnim brojem, npr. +381 60 123 4567. Razmaci i crtice se sami uklanjaju."

  - name: "legal"
    label: "Pravne strane"
    files:
      - name: "privacy"
        label: "Politika privatnosti"
        file: "content/privacy.json"
        fields: &legal_fields
          - { label: "Naslov", name: "title", widget: "string" }
          - { label: "Datum poslednje izmene", name: "updated", widget: "string", required: false }
          - { label: "Uvodni tekst", name: "intro", widget: "text", required: false }
          - label: "Sekcije"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            hint: "OVO JE NACRT. Sve u [UGLASTIM ZAGRADAMA] moraš da zameniš svojim podacima, i neka pravnik pregleda pre nego što počneš da naplaćuješ. Prazan red razdvaja pasuse."
            fields:
              - { label: "Naslov sekcije", name: "heading", widget: "string" }
              - { label: "Tekst", name: "body", widget: "text" }
      - name: "terms"
        label: "Uslovi korišćenja"
        file: "content/terms.json"
        fields: *legal_fields
      - name: "shipping"
        label: "Isporuka i povraćaj"
        file: "content/shipping.json"
        fields: *legal_fields

  - name: "categories"
    label: "Strane kategorija"
    files:
      - name: "categories"
        label: "Art / Apparel / Gifts"
        file: "content/categories.json"
        fields:
          - name: "items"
            label: "Kategorije"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "NE MENJAJ polje Slug — po njemu se svaka strana pronalazi. Proizvodi se ovde pojavljuju sami, po svojoj Kategoriji. Ako obrišeš kategoriju, njen link nestaje iz menija u vrhu i u futeru, a ko otvori staru adresu vraća se na naslovnu. Vrati je nazad sa istim slugom i sve radi opet. Postoje samo tri sluga: art, apparel, gifts."
            fields:
              - { label: "Slug (ne dirati)", name: "slug", widget: "string" }
              - { label: "Naslov strane", name: "title", widget: "string" }
              - { label: "Uvodni tekst", name: "intro", widget: "text", required: false }
              - label: "Velika slika na početnoj"
                name: "hero_image"
                widget: "image"
                required: false
                hint: "Uska traka na vrhu strane, visine 260px. Ostavi prazno za sivi kvadrat."
              - { label: "Opis slike", name: "hero_alt", widget: "string", required: false }
              - label: "Tekst preko slike"
                name: "hero_text"
                widget: "string"
                required: false
                hint: "Krupan natpis na sredini slike. Ostavi prazno da se ne prikazuje ništa."
              - { label: "Gde vodi slika", name: "hero_link", widget: "string", required: false }
