backend:
  name: git-gateway
  branch: claude/homepage-build-h289yn

# Where uploaded images are stored in the repo, and the URL path the
# site serves them from.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General"
        file: "content/settings.json"
        fields:
          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Shown at the top of the homepage. Leave blank to keep the grey placeholder."
          - label: "Hero Image Alt Text"
            name: "hero_alt"
            widget: "string"
            required: false
          - label: "Hero Link"
            name: "hero_link"
            widget: "string"
          - label: "\"Top Sellers\" Heading"
            name: "top_sellers_title"
            widget: "string"
          - label: "\"View All\" Link Text"
            name: "view_all_text"
            widget: "string"
          - label: "\"View All\" Link URL"
            name: "view_all_link"
            widget: "string"
          - label: "Instagram URL"
            name: "instagram_url"
            widget: "string"
            required: false
          - label: "WhatsApp URL"
            name: "whatsapp_url"
            widget: "string"
            required: false
          - label: "Footer Notice Text"
            name: "sales_notice"
            widget: "text"

  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "Top Sellers Grid"
        file: "content/products.json"
        fields:
          - name: "items"
            label: "Products"
            widget: "list"
            summary: "{{title}} — {{price}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Type"
                name: "type"
                widget: "string"
                default: "Print"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Art", "Apparel", "Gifts"]
                default: "Art"
                hint: "Which category page this product appears on."
              - label: "Base Price (USD)"
                name: "price"
                widget: "number"
                value_type: "float"
                min: 0
                hint: "Used only when the product has no sizes listed below. With sizes, each size sets its own price."
              - label: "Product Link"
                name: "href"
                widget: "string"
              - label: "Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Leave blank to show the grey placeholder."
              - label: "Image Alt Text"
                name: "alt"
                widget: "string"
                required: false

  - name: "product"
    label: "Product Page"
    files:
      - name: "product"
        label: "The Statue"
        file: "content/product.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Images by Material"
            name: "media"
            widget: "list"
            summary: "{{fields.group}}"
            hint: "One image per material, shared by every size of it. The Group name must match the Group set on the options below — that is how the page knows which image to show."
            fields:
              - label: "Group"
                name: "group"
                widget: "string"
                hint: "e.g. Print or Canvas"
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image Alt Text", name: "alt", widget: "string", required: false }
          - label: "Line Under the Price"
            name: "ship_note"
            widget: "string"
            required: false
          - label: "Breadcrumb"
            name: "crumbs"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - label: "Size and Type"
            name: "variants"
            widget: "list"
            summary: "{{fields.label}} — {{fields.price}}"
            hint: "Each option sets its own price. Tick \"Selected by default\" on ONE option — the page opens on it and shows its price."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - label: "Price (USD)"
                name: "price"
                widget: "number"
                value_type: "float"
                min: 0
              - label: "Group"
                name: "group"
                widget: "string"
                hint: "Which image this option shows — must match a Group in \"Images by Material\" above."
              - label: "Note"
                name: "note"
                widget: "string"
                required: false
                hint: "Shown under the options while this one is selected, e.g. whether a frame is included."
              - { label: "Selected by default", name: "selected", widget: "boolean", default: false, required: false }
          - label: "Notes Under the Button"
            name: "notes"
            widget: "list"
            required: false
            field: { label: "Note", name: "note", widget: "string" }
          - label: "Collapsible Panels"
            name: "panels"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Wide Image Below"
            name: "showcase_image"
            widget: "image"
            required: false
          - { label: "Wide Image Alt Text", name: "showcase_alt", widget: "string", required: false }

  - name: "contact"
    label: "Contact Page"
    files:
      - name: "contact"
        label: "Contact"
        file: "content/contact.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - label: "Email Address"
            name: "email"
            widget: "string"
            hint: "Shown as a clickable mailto link."
          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"
            hint: "Include the country code, e.g. +381 60 123 4567. Spaces and dashes are stripped for the wa.me link."

  - name: "legal"
    label: "Legal Pages"
    files:
      - name: "privacy"
        label: "Privacy Policy"
        file: "content/privacy.json"
        fields: &legal_fields
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "updated", widget: "string", required: false }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            hint: "DRAFT TEXT — anything in [SQUARE BRACKETS] must be replaced with your real details, and the whole page should be checked by someone qualified before you take orders. Leave a blank line between paragraphs."
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
      - name: "terms"
        label: "Terms & Conditions"
        file: "content/terms.json"
        fields: *legal_fields

  - name: "categories"
    label: "Category Pages"
    files:
      - name: "categories"
        label: "Art / Apparel / Gifts"
        file: "content/categories.json"
        fields:
          - name: "items"
            label: "Categories"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "The Slug must stay as it is — each category page looks itself up by slug. Products appear here by their own Category field."
            fields:
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text", required: false }
              - label: "Hero Image"
                name: "hero_image"
                widget: "image"
                required: false
                hint: "The 260px band at the top. Leave blank for the grey placeholder."
              - { label: "Hero Image Alt Text", name: "hero_alt", widget: "string", required: false }
              - { label: "Hero Link", name: "hero_link", widget: "string", required: false }
